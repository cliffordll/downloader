<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>AVDownloader</title></head>
<body>
  <header><h1>AVDownloader</h1><p>当前标签页的视频地址</p></header>
  <details><summary>连接下载器</summary>
    <p>先在下载器打开“文件 → 浏览器扩展配对”，复制配对码。</p>
    <label for="token">配对码</label>
    <input id="token" type="password" autocomplete="off" placeholder="粘贴配对码">
    <button id="pair">保存配对码</button>
    <p>配对一次即可，重启后仍保留。下载器重置配对码后，请保存新码。</p>
  </details>
  <nav><button id="refresh">刷新列表</button><button id="clear">清空当前页</button></nav>
  <p id="status" role="status" aria-live="polite"></p>
  <main id="list"></main>
  <footer>请刷新网页并播放视频。每页最多保留 100 个地址；支持识别网址后缀或响应类型。不读取 Cookie。</footer>
  <script type="module" src="popup.js"></script>
</body></html>
